# project.yml
name: Knippi
options:
  bundleIdPrefix: dev.mwlr
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.6.2"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SharedKit:
    path: Packages/SharedKit
  CaptureKit:
    path: Packages/CaptureKit
  RecordingKit:
    path: Packages/RecordingKit
  CameraKit:
    path: Packages/CameraKit
  AnnotationKit:
    path: Packages/AnnotationKit
  OCRKit:
    path: Packages/OCRKit
  ExportKit:
    path: Packages/ExportKit
  EffectsKit:
    path: Packages/EffectsKit
  EditorKit:
    path: Packages/EditorKit
  ShareKit:
    path: Packages/ShareKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    exactVersion: "1.1.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"

targets:
  Knippi:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Info.plist"
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.knippi
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Entitlements/Knippi.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        PRODUCT_NAME: Knippi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SharedKit
      - package: CaptureKit
      - package: RecordingKit
      - package: CameraKit
      - package: AnnotationKit
      - package: OCRKit
      - package: ExportKit
      - package: EffectsKit
      - package: EditorKit
      - package: ShareKit
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
      - package: Sparkle
    entitlements:
      path: App/Entitlements/Knippi.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.network.client: true

  KnippiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: Knippi
      - package: SharedKit
      - package: AnnotationKit
      - package: OCRKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.knippi.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Knippi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Knippi"

schemes:
  Knippi:
    build:
      targets:
        Knippi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KnippiTests
